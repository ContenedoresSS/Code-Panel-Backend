services:
  code-panel-back:
    image: ghcr.io/contenedoresss/code-panel-backend:${IMAGE_VERSION:-latest}
    container_name: code-panel-back
    restart: unless-stopped
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - templates:/app/templates

volumes:
  templates:
    driver: local
